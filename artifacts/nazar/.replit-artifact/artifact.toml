kind = "web"
previewPath = "/"
title = "Nazar — Daily Noticing Journal"
version = "1.0.0"
id = "artifacts/nazar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25400

[services.development]
run = "pnpm --filter @workspace/nazar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nazar", "run", "build" ]
publicDir = "artifacts/nazar/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25400"
BASE_PATH = "/"
